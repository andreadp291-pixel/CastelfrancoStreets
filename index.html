<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>OSM Castelfranco - Infrastruttura</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --proposed:   #f97316;
      --cycleway:   #06b6d4;
      --pedestrian: #22c55e;
      --crossing:   #8b5cf6;
      --construction:#f59e0b;
      --maxspeed:   #ef4444;
      --bg-dark:    #0f172a;
      --bg-card:    rgba(255,255,255,0.93);
      --text-main:  #1e293b;
      --text-light: #64748b;
      --radius:     14px;
      --shadow:     0 8px 32px rgba(0,0,0,0.13);
      --border:     1px solid rgba(255,255,255,0.6);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    #map { position: absolute; inset: 0; z-index: 1; }

    /* ─── TOPBAR ─── */
    #topbar {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 24px); max-width: 700px; z-index: 1000;
      display: flex; align-items: center; gap: 6px; pointer-events: none;
      flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px;
      scrollbar-width: none;
    }
    #topbar::-webkit-scrollbar { display: none; }
    #topbar > * { pointer-events: auto; flex-shrink: 0; }

    .chip {
      height: 38px; padding: 0 11px; border-radius: 30px;
      font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 5px;
      color: white; white-space: nowrap; box-shadow: var(--shadow);
      transition: transform .15s;
    }
    .chip:hover { transform: scale(1.04); }
    .chip.proposed     { background: var(--proposed); }
    .chip.cycleway     { background: var(--cycleway); }
    .chip.pedestrian   { background: var(--pedestrian); }
    .chip.crossing     { background: var(--crossing); }
    .chip.construction { background: var(--construction); }
    .chip.maxspeed     { background: var(--maxspeed); }

    .ctrl-btn {
      height: 38px; min-width: 38px; background: var(--bg-card);
      backdrop-filter: blur(14px); border: var(--border);
      border-radius: var(--radius); display: flex; align-items: center;
      justify-content: center; cursor: pointer; box-shadow: var(--shadow);
      transition: background .2s, transform .15s; color: var(--text-main);
      padding: 0 12px; gap: 6px; font-size: 12px; font-weight: 600;
    }
    .ctrl-btn:hover { background: white; transform: scale(1.06); }
    .ctrl-btn.spinning svg { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── LAYER CONTROL ─── */
    .leaflet-control-layers {
      border-radius: 14px !important; box-shadow: var(--shadow) !important;
      border: var(--border) !important; padding: 8px 4px !important;
      background: var(--bg-card) !important; backdrop-filter: blur(14px) !important;
    }
    .leaflet-control-layers-overlays label { padding: 4px 8px; font-size: 12px; }

    /* ─── INFO PANEL ─── */
    #infoPanel {
      position: fixed; top: 66px; right: 14px;
      width: 340px; max-width: calc(100% - 28px);
      max-height: calc(100vh - 86px);
      background: var(--bg-card); backdrop-filter: blur(18px);
      border: var(--border); border-radius: 20px;
      box-shadow: var(--shadow); z-index: 1000;
      display: flex; flex-direction: column;
      transform: translateX(calc(100% + 20px)); opacity: 0;
      transition: transform .38s cubic-bezier(.16,1,.3,1), opacity .38s;
    }
    #infoPanel.active { transform: translateX(0); opacity: 1; }

    .info-header {
      padding: 13px 15px; border-radius: 20px 20px 0 0;
      display: flex; justify-content: space-between; align-items: center;
      font-weight: 700; font-size: 14px; color: white;
      background: var(--bg-dark); transition: background .3s;
    }
    #closeInfo {
      cursor: pointer; opacity: .7; transition: opacity .2s;
      display: flex; align-items: center; padding: 4px;
      border-radius: 6px;
    }
    #closeInfo:hover { opacity: 1; background: rgba(255,255,255,0.15); }
    .info-type-badge {
      font-size: 10px; font-weight: 600; letter-spacing: .5px;
      padding: 2px 8px; border-radius: 20px; background: rgba(255,255,255,0.2);
      text-transform: uppercase;
    }
    .info-road-name {
      padding: 13px 15px 9px; border-bottom: 2px solid #f1f5f9;
    }
    .info-road-name h3 { margin: 0 0 3px; font-size: 15px; color: var(--text-main); font-weight: 700; }
    .info-road-name p  { margin: 0; font-size: 12px; color: var(--text-light); }

    .info-content { overflow-y: auto; flex-grow: 1; border-radius: 0 0 20px 20px; }
    .info-section { padding: 10px 15px 4px; }
    .info-section-title {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .8px; color: var(--text-light); margin-bottom: 6px;
    }
    .info-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 0; border-bottom: 1px solid #f1f5f9; gap: 10px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-label {
      font-size: 12px; color: var(--text-light); font-weight: 500;
      display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    }
    .info-value {
      font-size: 12px; color: var(--text-main); font-weight: 600;
      text-align: right; word-break: break-word;
    }
    .info-value a {
      color: #2563eb; text-decoration: underline; word-break: break-all;
    }
    .info-badge-val {
      font-size: 11px; font-weight: 700; padding: 2px 8px;
      border-radius: 20px; white-space: nowrap;
    }
    .badge-green  { background: #dcfce7; color: #16a34a; }
    .badge-red    { background: #fee2e2; color: #dc2626; }
    .badge-blue   { background: #dbeafe; color: #2563eb; }
    .badge-orange { background: #ffedd5; color: #ea580c; }
    .badge-amber  { background: #fef9c3; color: #b45309; }
    .badge-purple { background: #f3e8ff; color: #7c3aed; }
    .badge-gray   { background: #f1f5f9; color: #475569; }
    .badge-speed  { font-size: 12px; font-weight: 800; padding: 2px 9px; border-radius: 6px; border: 2px solid currentColor; }

    #rawToggle {
      display: flex; align-items: center; gap: 6px;
      padding: 10px 15px; cursor: pointer; font-size: 11px;
      color: var(--text-light); font-weight: 600;
      border-top: 1px solid #f1f5f9; user-select: none;
    }
    #rawToggle:hover { color: var(--text-main); }
    #rawTags { display: none; }
    #rawTags.open { display: block; }
    .tag-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .tag-table th {
      background: #f8fafc; padding: 7px 12px; text-align: left;
      color: var(--text-light); width: 38%; border-bottom: 1px solid #f1f5f9; font-weight: 600;
    }
    .tag-table td {
      padding: 7px 12px; color: var(--text-main);
      border-bottom: 1px solid #f1f5f9; word-break: break-all;
    }

    /* ─── STATUS ─── */
    #status {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%) translateY(6px);
      background: var(--bg-dark); color: white; padding: 9px 18px;
      border-radius: 30px; font-size: 13px; font-weight: 500;
      z-index: 2000; display: flex; align-items: center; gap: 8px;
      opacity: 0; pointer-events: none;
      transition: opacity .3s, transform .3s; white-space: nowrap;
    }
    #status.show    { opacity: 1; transform: translateX(-50%) translateY(0); }
    #status.error   { background: #dc2626; }
    #status.success { background: #16a34a; }
    .spinner {
      width: 13px; height: 13px; border: 2px solid rgba(255,255,255,.3);
      border-top-color: white; border-radius: 50%;
      animation: spin .7s linear infinite; flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div id="topbar">
    <span class="chip proposed"     id="cnt0">— Proposte</span>
    <span class="chip cycleway"     id="cnt1">— Ciclabili</span>
    <span class="chip pedestrian"   id="cnt2">— Pedonali</span>
    <span class="chip crossing"     id="cnt3">— Attraversamenti</span>
    <span class="chip construction" id="cnt4">— Costruzione</span>
    <span class="chip maxspeed"     id="cnt5">— Velocità</span>
    <button id="refreshBtn" class="ctrl-btn" title="Aggiorna">
      <i data-lucide="refresh-cw" width="15" height="15"></i>
    </button>
  </div>

  <div id="map"></div>

  <!-- INFO PANEL -->
  <div id="infoPanel">
    <div class="info-header" id="infoHeader">
      <div style="display:flex;align-items:center;gap:8px">
        <i data-lucide="map-pin" width="15" height="15"></i>
        <span id="infoTitle">Dettagli</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="info-type-badge" id="infoBadge"></span>
        <div id="closeInfo"><i data-lucide="x" width="16" height="16"></i></div>
      </div>
    </div>
    <div id="infoRoadName" class="info-road-name" style="display:none">
      <h3 id="infoRoadNameText"></h3>
      <p  id="infoRoadNameSub"></p>
    </div>
    <div class="info-content">
      <div id="infoSections"></div>
      <div id="rawToggle">
        <i data-lucide="code" width="13" height="13"></i>
        Dati tecnici grezzi
        <i data-lucide="chevron-down" width="13" height="13" id="rawChevron"></i>
      </div>
      <div id="rawTags">
        <table class="tag-table" id="infoTable"></table>
      </div>
    </div>
  </div>

  <div id="status"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/osmtogeojson@3.0.0-beta.4/osmtogeojson.js"></script>
  <script>
    lucide.createIcons();

    // ── MAP ──
    const map = L.map('map', { zoomControl: false }).setView([45.671, 11.928], 14);
    setTimeout(() => map.invalidateSize(), 100);
    L.control.zoom({ position: 'bottomleft' }).addTo(map);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors', maxZoom: 19
    }).addTo(map);

    // ── LAYER GROUPS — tutti disattivi all'avvio ──
    const layers = {
      proposed:     L.layerGroup(),
      cycleway:     L.layerGroup(),
      pedestrian:   L.layerGroup(),
      crossing:     L.layerGroup(),
      construction: L.layerGroup(),
      maxspeed:     L.layerGroup()
    };

    L.control.layers(null, {
      "<span style='color:#f97316;font-weight:700'>🔶 Strade proposte</span>":    layers.proposed,
      "<span style='color:#06b6d4;font-weight:700'>🚲 Ciclabili</span>":           layers.cycleway,
      "<span style='color:#22c55e;font-weight:700'>🚶 Percorsi pedonali</span>":   layers.pedestrian,
      "<span style='color:#8b5cf6;font-weight:700'>🔀 Attraversamenti</span>":     layers.crossing,
      "<span style='color:#f59e0b;font-weight:700'>🚧 In costruzione</span>":      layers.construction,
      "<span style='color:#ef4444;font-weight:700'>⚡ Velocità massime</span>":    layers.maxspeed
    }, { collapsed: false, position: 'bottomleft' }).addTo(map);

    // ── STILI ──
    const STYLES = {
      proposed:     { color: '#f97316', weight: 5, dashArray: '10 6', lineCap: 'round', opacity: .9 },
      cycleway:     { color: '#06b6d4', weight: 4, lineCap: 'round', opacity: .9 },
      pedestrian:   { color: '#22c55e', weight: 3, lineCap: 'round', opacity: .85 },
      crossing:     { color: '#8b5cf6', weight: 4, dashArray: '4 4', lineCap: 'round', opacity: .9 },
      construction: { color: '#f59e0b', weight: 5, dashArray: '6 4', lineCap: 'round', opacity: .9 },
      default:      { color: '#94a3b8', weight: 2, opacity: .6 }
    };

    function maxspeedStyle(speed) {
      const s = parseInt(speed) || 50;
      let color = '#4ade80';
      if (s <= 10)       color = '#86efac';
      else if (s <= 30)  color = '#4ade80';
      else if (s <= 50)  color = '#facc15';
      else if (s <= 70)  color = '#fb923c';
      else if (s <= 90)  color = '#f87171';
      else               color = '#dc2626';
      return { color, weight: 5, opacity: .8, lineCap: 'round' };
    }

    function getType(tags) {
      if (tags.highway === 'proposed')                                                   return 'proposed';
      if (tags.highway === 'construction')                                               return 'construction';
      if (tags.footway === 'crossing' || tags.cycleway === 'crossing'
          || tags.highway === 'crossing')                                                return 'crossing';
      if (tags.highway === 'cycleway' || (tags.cycleway && !['crossing','no','opposite'].includes(tags.cycleway))) return 'cycleway';
      if (['footway','path','pedestrian','steps','bridleway'].includes(tags.highway))    return 'pedestrian';
      return 'default';
    }

    const TYPE_META = {
      proposed:     { label: 'Strada proposta',   bg: '#f97316' },
      cycleway:     { label: 'Pista ciclabile',   bg: '#06b6d4' },
      pedestrian:   { label: 'Percorso pedonale', bg: '#22c55e' },
      crossing:     { label: 'Attraversamento',   bg: '#8b5cf6' },
      construction: { label: 'In costruzione',    bg: '#f59e0b' },
      default:      { label: 'Via',               bg: '#1e293b' }
    };

    // ── DIZIONARIO TAG ──
    const TAG_LABELS = {
      'name':          { it: 'Nome',               icon: 'tag' },
      'name:it':       { it: 'Nome (IT)',           icon: 'tag' },
      'ref':           { it: 'Codice/Ref.',         icon: 'hash' },
      'alt_name':      { it: 'Nome alternativo',    icon: 'tag' },
      'highway':       { it: 'Tipo di via',         icon: 'road' },
      'cycleway':      { it: 'Tipo ciclabile',      icon: 'bike' },
      'footway':       { it: 'Tipo percorso',       icon: 'footprints' },
      'crossing':      { it: 'Tipo attraversamento',icon: 'arrow-left-right' },
      'surface':       { it: 'Superficie',          icon: 'layers' },
      'width':         { it: 'Larghezza',           icon: 'ruler' },
      'lanes':         { it: 'Corsie',              icon: 'align-justify' },
      'maxspeed':      { it: 'Velocità massima',    icon: 'gauge' },
      'lit':           { it: 'Illuminazione',       icon: 'lamp' },
      'incline':       { it: 'Pendenza',            icon: 'trending-up' },
      'smoothness':    { it: 'Qualità fondo',       icon: 'activity' },
      'segregated':    { it: 'Separato dal traffico',icon: 'separator-horizontal' },
      'access':        { it: 'Accesso',             icon: 'lock' },
      'bicycle':       { it: 'Biciclette',          icon: 'bike' },
      'foot':          { it: 'Pedoni',              icon: 'footprints' },
      'motor_vehicle': { it: 'Veicoli a motore',    icon: 'car' },
      'oneway':        { it: 'Senso unico',         icon: 'arrow-right' },
      'oneway:bicycle':{ it: 'Senso unico bici',    icon: 'arrow-right' },
      'tactile_paving':{ it: 'Pavimentazione tattile',icon: 'grip' },
      'wheelchair':    { it: 'Accessibilità sedia a rotelle', icon: 'accessibility' },
      'construction':  { it: 'Tipo in costruzione', icon: 'hard-hat' },
      'opening_date':  { it: 'Data apertura prevista', icon: 'calendar-check' },
      'start_date':    { it: 'Data inizio lavori',  icon: 'calendar' },
      'operator':      { it: 'Gestore',             icon: 'building' },
      'source':        { it: 'Fonte dati',          icon: 'database' },
      'note':          { it: 'Note',                icon: 'message-square' },
      'description':   { it: 'Descrizione',         icon: 'file-text' },
      'website':       { it: 'Sito web',            icon: 'globe' },
      'url':           { it: 'Link',                icon: 'link' },
      'wikipedia':     { it: 'Wikipedia',           icon: 'book-open' },
      'wikidata':      { it: 'Wikidata',            icon: 'database' },
    };

    const VALUE_LABELS = {
      'proposed':'Proposta', 'cycleway':'Pista ciclabile', 'footway':'Percorso pedonale',
      'path':'Sentiero', 'pedestrian':'Zona pedonale', 'steps':'Scalinata',
      'bridleway':'Pista equestre', 'crossing':'Attraversamento',
      'construction':'In costruzione', 'residential':'Strada residenziale',
      'primary':'Strada principale', 'secondary':'Strada secondaria',
      'tertiary':'Strada locale', 'service':'Accesso privato',
      'track':'Pista sterrata', 'living_street':'Zona 30', 'unclassified':'Via non classificata',
      'asphalt':'Asfalto', 'concrete':'Calcestruzzo', 'paving_stones':'Pavé',
      'gravel':'Ghiaia', 'unpaved':'Non asfaltato', 'dirt':'Terra battuta',
      'grass':'Erba', 'cobblestone':'Selciato', 'compacted':'Stabilizzato',
      'yes':'Sì', 'no':'No', 'private':'Privato', 'permissive':'Consentito',
      'designated':'Dedicato', 'dismount':'Solo a mano', 'destination':'Solo destinazione',
      'excellent':'Eccellente', 'good':'Buono', 'intermediate':'Discreto',
      'bad':'Scarso', 'very_bad':'Pessimo', 'horrible':'Impraticabile',
      'marked':'Segnalato', 'uncontrolled':'Non segnalato',
      'traffic_signals':'Con semaforo', 'zebra':'Strisce pedonali',
      'lane':'Corsia', 'share_busway':'Con autobus', 'shared_lane':'Corsia condivisa',
      '-1':'Senso inverso',
    };

    const GROUPS = [
      { title: 'Caratteristiche',  icon: 'info',
        keys: ['highway','cycleway','footway','crossing','construction','surface','width','lanes','lit','smoothness','incline','segregated','tactile_paving','wheelchair'] },
      { title: 'Velocità',         icon: 'gauge',
        keys: ['maxspeed'] },
      { title: 'Accesso',          icon: 'lock',
        keys: ['access','bicycle','foot','motor_vehicle','oneway','oneway:bicycle'] },
      { title: 'Stato & Progetto', icon: 'calendar',
        keys: ['start_date','opening_date','operator','note','description'] },
      { title: 'Link & Risorse',   icon: 'link',
        keys: ['website','url','wikipedia','wikidata','source'] },
    ];

    // ── FORMATTAZIONE VALORI ──
    function isURL(val) {
      return typeof val === 'string' &&
        (val.startsWith('http://') || val.startsWith('https://') || val.startsWith('www.'));
    }

    function formatRawValue(val) {
      if (isURL(val)) {
        const href = val.startsWith('www.') ? 'https://' + val : val;
        return `<a href="${href}" target="_blank" rel="noopener">${val}</a>`;
      }
      return val;
    }

    function translateValue(key, val) {
      if (!val || val === 'null') return null;
      if (key === 'maxspeed') return val + ' km/h';
      if (key === 'wikipedia') {
        const parts = val.split(':');
        const lang = parts.length > 1 ? parts[0] : 'it';
        const title = parts.length > 1 ? parts.slice(1).join(':') : val;
        return `<a href="https://${lang}.wikipedia.org/wiki/${encodeURIComponent(title)}" target="_blank" rel="noopener">${val}</a>`;
      }
      if (key === 'wikidata') {
        return `<a href="https://www.wikidata.org/wiki/${val}" target="_blank" rel="noopener">${val}</a>`;
      }
      if (isURL(val)) {
        const href = val.startsWith('www.') ? 'https://' + val : val;
        return `<a href="${href}" target="_blank" rel="noopener">${val}</a>`;
      }
      return VALUE_LABELS[val] || val;
    }

    function valueBadge(key, val) {
      const v = translateValue(key, val);
      if (!v) return null;
      if (key === 'maxspeed') {
        const s = parseInt(val) || 50;
        let color = '#16a34a';
        if (s <= 10)      color = '#16a34a';
        else if (s <= 30) color = '#15803d';
        else if (s <= 50) color = '#b45309';
        else if (s <= 70) color = '#ea580c';
        else if (s <= 90) color = '#dc2626';
        else              color = '#991b1b';
        return `<span class="info-badge-val badge-speed" style="color:${color};border-color:${color}">${v}</span>`;
      }
      let cls = 'badge-gray';
      if (['yes','designated','permissive','excellent','good'].includes(val))   cls = 'badge-green';
      if (['no','private','bad','very_bad','horrible'].includes(val))           cls = 'badge-red';
      if (['proposed'].includes(val))                                            cls = 'badge-orange';
      if (['construction'].includes(val))                                        cls = 'badge-amber';
      if (['crossing'].includes(val))                                            cls = 'badge-purple';
      if (['cycleway','footway','pedestrian'].includes(val))                     cls = 'badge-blue';
      // se è un link non mettere il badge, solo il link
      if (v.includes('<a ')) return `<span class="info-value">${v}</span>`;
      return `<span class="info-badge-val ${cls}">${v}</span>`;
    }

    // ── APRI INFO PANEL ──
    function openInfoPanel(feature) {
      const tags = feature.properties;
      const type = getType(tags);
      const meta = TYPE_META[type] || TYPE_META.default;

      document.getElementById('infoHeader').style.background = meta.bg;
      document.getElementById('infoBadge').textContent = meta.label;

      const name = tags.name || tags['name:it'] || tags['alt_name'] || '';
      const sub  = tags.ref ? `Rif. ${tags.ref}` : '';
      const nameBlock = document.getElementById('infoRoadName');
      if (name) {
        document.getElementById('infoRoadNameText').textContent = name;
        document.getElementById('infoRoadNameSub').textContent  = sub;
        nameBlock.style.display = 'block';
        document.getElementById('infoTitle').textContent = name;
      } else {
        nameBlock.style.display = 'none';
        document.getElementById('infoTitle').textContent = meta.label;
      }

      const sectionsEl = document.getElementById('infoSections');
      let sectionsHTML = '';
      const usedKeys = new Set(['name','name:it','alt_name','official_name','ref','id','type',
        '@id','@timestamp','@version','@changeset','@uid','@user']);

      GROUPS.forEach(group => {
        const rows = [];
        group.keys.forEach(key => {
          const val = tags[key];
          if (!val || val === 'null') return;
          usedKeys.add(key);
          const info  = TAG_LABELS[key] || { it: key, icon: 'tag' };
          const badge = valueBadge(key, val);
          rows.push(`
            <div class="info-row">
              <span class="info-label">
                <i data-lucide="${info.icon}" width="13" height="13"></i>${info.it}
              </span>
              <span class="info-value">${badge || translateValue(key, val) || val}</span>
            </div>`);
        });
        if (rows.length) {
          sectionsHTML += `<div class="info-section">
            <div class="info-section-title">${group.title}</div>
            ${rows.join('')}
          </div>`;
        }
      });

      // Tag extra non categorizzati
      const extraRows = [];
      Object.keys(tags).sort().forEach(key => {
        if (usedKeys.has(key)) return;
        const val = tags[key];
        if (!val || val === 'null') return;
        const info  = TAG_LABELS[key] || { it: key, icon: 'tag' };
        const badge = valueBadge(key, val);
        extraRows.push(`
          <div class="info-row">
            <span class="info-label">
              <i data-lucide="${info.icon}" width="13" height="13"></i>${info.it}
            </span>
            <span class="info-value">${badge || translateValue(key, val) || val}</span>
          </div>`);
      });
      if (extraRows.length) {
        sectionsHTML += `<div class="info-section"><div class="info-section-title">Altre info</div>${extraRows.join('')}</div>`;
      }

      sectionsEl.innerHTML = sectionsHTML ||
        `<div style="padding:16px;font-size:13px;color:var(--text-light)">Nessun dettaglio disponibile.</div>`;

      // Raw tags (con link cliccabili)
      const rawRows = Object.keys(tags).sort()
        .filter(k => tags[k] !== null && tags[k] !== '')
        .map(k => `<tr><th>${k}</th><td>${formatRawValue(tags[k])}</td></tr>`).join('');
      document.getElementById('infoTable').innerHTML = rawRows;
      document.getElementById('rawTags').classList.remove('open');
      document.getElementById('rawChevron').setAttribute('data-lucide','chevron-down');

      document.getElementById('infoPanel').classList.add('active');
      lucide.createIcons();
    }

    // ── RAW TOGGLE ──
    document.getElementById('rawToggle').addEventListener('click', () => {
      const raw  = document.getElementById('rawTags');
      const chev = document.getElementById('rawChevron');
      raw.classList.toggle('open');
      chev.setAttribute('data-lucide', raw.classList.contains('open') ? 'chevron-up' : 'chevron-down');
      lucide.createIcons();
    });

    // ── STATUS ──
    let statusTimer;
    function setStatus(msg, type = '', duration = 0) {
      clearTimeout(statusTimer);
      const s = document.getElementById('status');
      s.className = type ? `show ${type}` : 'show';
      s.innerHTML = type === 'loading'
        ? `<div class="spinner"></div>${msg}`
        : `<i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}" width="14" height="14" style="flex-shrink:0"></i>${msg}`;
      lucide.createIcons();
      if (duration) statusTimer = setTimeout(() => s.classList.remove('show'), duration);
    }

    // ── LOAD DATA ──
    const counts = { proposed: 0, cycleway: 0, pedestrian: 0, crossing: 0, construction: 0, maxspeed: 0 };
    const COUNTER_IDS = ['cnt0','cnt1','cnt2','cnt3','cnt4','cnt5'];
    const COUNTER_KEYS = ['proposed','cycleway','pedestrian','crossing','construction','maxspeed'];
    const COUNTER_LABELS = ['Proposte','Ciclabili','Pedonali','Attraversamenti','Costruzione','Velocità'];

    function updateCounters() {
      COUNTER_KEYS.forEach((key, i) => {
        document.getElementById(COUNTER_IDS[i]).textContent = counts[key] + ' ' + COUNTER_LABELS[i];
      });
    }

    async function loadData() {
      document.getElementById('refreshBtn').classList.add('spinning');
      setStatus('Caricamento dati…', 'loading');
      Object.values(layers).forEach(l => l.clearLayers());
      COUNTER_KEYS.forEach(k => counts[k] = 0);
      updateCounters();

      const query = `[out:json][timeout:45];
        area["name"="Castelfranco Veneto"]->.a;
        (
          way["highway"="proposed"](area.a);
          way["highway"="construction"](area.a);
          way["highway"="cycleway"](area.a);
          way["cycleway"](area.a);
          way["highway"="footway"](area.a);
          way["highway"="path"](area.a);
          way["highway"="pedestrian"](area.a);
          way["highway"="steps"](area.a);
          way["footway"="crossing"](area.a);
          way["cycleway"="crossing"](area.a);
          way["highway"="crossing"](area.a);
          way["maxspeed"](area.a);
        );
        out body; >; out skel qt;`;

      try {
        const res    = await fetch('https://overpass-api.de/api/interpreter', {
          method: 'POST', body: 'data=' + encodeURIComponent(query)
        });
        const data   = await res.json();
        const geojson = osmtogeojson(data);

        L.geoJSON(geojson, {
          filter: f => f.geometry && f.geometry.type !== 'Point',
          style:  f => ({ ...STYLES[getType(f.properties)] || STYLES.default }),
          onEachFeature: (feature, layer) => {
            const tags = feature.properties;
            const type = getType(tags);
            const name = tags.name || tags['name:it'] || '';
            const base = { ...(STYLES[type] || STYLES.default) };

            if (name) layer.bindTooltip(name, { sticky: true, className: 'osm-tooltip', direction: 'top' });
            layer.on('mouseover', () => layer.setStyle({ ...base, weight: base.weight + 2, opacity: 1 }));
            layer.on('mouseout',  () => layer.setStyle(base));
            layer.on('click', e  => { L.DomEvent.stopPropagation(e); openInfoPanel(feature); });

            // Smistamento layer principale
            if (type !== 'default') {
              layer.addTo(layers[type]);
              counts[type]++;
            }

            // Layer velocità massima: aggiunge una linea parallela colorata
            if (tags.maxspeed) {
              const speedLine = L.geoJSON(feature, { style: maxspeedStyle(tags.maxspeed) });
              speedLine.on('click', e => { L.DomEvent.stopPropagation(e); openInfoPanel(feature); });
              speedLine.eachLayer(l => layers.maxspeed.addLayer(l));
              if (type === 'default') counts.maxspeed++; // evita doppio conteggio
            }
          }
        });

        // Conta maxspeed su tutte le feature con maxspeed
        const maxspeedTotal = geojson.features.filter(f => f.properties.maxspeed && f.geometry?.type !== 'Point').length;
        counts.maxspeed = maxspeedTotal;
        updateCounters();
        setStatus(`${geojson.features.length} elementi caricati`, 'success', 3000);
      } catch (e) {
        console.error(e);
        setStatus('Errore caricamento dati', 'error', 4000);
      } finally {
        document.getElementById('refreshBtn').classList.remove('spinning');
      }
    }

    // ── EVENTI ──
    document.getElementById('closeInfo').addEventListener('click', () =>
      document.getElementById('infoPanel').classList.remove('active'));
    document.getElementById('refreshBtn').addEventListener('click', loadData);
    map.on('click', () => document.getElementById('infoPanel').classList.remove('active'));

    // Tooltip style
    const s = document.createElement('style');
    s.textContent = `.osm-tooltip {
      background: #0f172a; color: white; border: none;
      border-radius: 8px; padding: 4px 10px; font-size: 12px;
      font-family: Inter, sans-serif; font-weight: 600;
      box-shadow: 0 4px 12px rgba(0,0,0,.3);
    }
    .osm-tooltip::before { display: none; }`;
    document.head.appendChild(s);

    loadData();
  </script>
</body>
</html>
