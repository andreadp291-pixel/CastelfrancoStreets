<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>OSM Castelfranco - Proposed & Infrastructure</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --primary:       #f97316;
      --primary-glow:  rgba(249,115,22,0.35);
      --cycle:         #06b6d4;
      --cycle-glow:    rgba(6,182,212,0.35);
      --sidewalk:      #94a3b8;
      --sidewalk-glow: rgba(148,163,184,0.35);
      --bg-dark:       #0f172a;
      --bg-card:       rgba(255,255,255,0.92);
      --text-main:     #1e293b;
      --text-light:    #64748b;
      --radius:        14px;
      --shadow:        0 8px 32px rgba(0,0,0,0.12);
      --border:        1px solid rgba(255,255,255,0.6);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    #map { position: absolute; inset: 0; z-index: 1; }

    #topbar {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 28px); max-width: 480px; z-index: 1000;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      pointer-events: none;
    }
    #topbar > * { pointer-events: auto; }

    .chip {
      height: 42px; padding: 0 14px; border-radius: 30px;
      font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px;
      color: white; letter-spacing: .3px;
    }
    .chip.proposed { background: var(--primary); box-shadow: 0 2px 12px var(--primary-glow); }
    .chip.cycle    { background: var(--cycle);   box-shadow: 0 2px 12px var(--cycle-glow); }
    .chip.sidewalk { background: var(--sidewalk);box-shadow: 0 2px 12px var(--sidewalk-glow); }

    .ctrl-btn {
      height: 42px; width: 42px; background: var(--bg-card);
      backdrop-filter: blur(14px); border: var(--border);
      border-radius: var(--radius); display: flex; align-items: center;
      justify-content: center; cursor: pointer; box-shadow: var(--shadow);
      transition: background .2s, transform .15s; color: var(--text-main);
    }
    .ctrl-btn:hover { background: white; transform: scale(1.06); }
    .ctrl-btn.spinning svg { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .leaflet-control-layers {
      border-radius: 14px !important; box-shadow: var(--shadow) !important;
      border: var(--border) !important; padding: 8px 4px !important;
      background: var(--bg-card) !important; backdrop-filter: blur(14px) !important;
    }
    .leaflet-control-layers-overlays label { padding: 4px 8px; font-size: 12px; }

    /* ─── INFO PANEL ─── */
    #infoPanel {
      position: fixed; top: 74px; right: 14px;
      width: 340px; max-width: calc(100% - 28px);
      max-height: calc(100vh - 100px);
      background: var(--bg-card); backdrop-filter: blur(18px);
      border: var(--border); border-radius: 20px;
      box-shadow: var(--shadow); z-index: 1000;
      display: flex; flex-direction: column;
      transform: translateX(calc(100% + 20px)); opacity: 0;
      transition: transform .38s cubic-bezier(.16,1,.3,1), opacity .38s;
    }
    #infoPanel.active { transform: translateX(0); opacity: 1; }

    .info-header {
      padding: 14px 16px; border-radius: 20px 20px 0 0;
      display: flex; justify-content: space-between; align-items: center;
      font-weight: 700; font-size: 14px; color: white;
      background: var(--bg-dark); transition: background .3s;
    }
    /* FIX X: il wrapper ha il cursore e l'handler, non l'icona */
    #closeInfo {
      cursor: pointer; opacity: .7; transition: opacity .2s;
      display: flex; align-items: center; padding: 4px;
      border-radius: 6px;
    }
    #closeInfo:hover { opacity: 1; background: rgba(255,255,255,0.15); }

    .info-type-badge {
      font-size: 10px; font-weight: 600; letter-spacing: .5px;
      padding: 2px 8px; border-radius: 20px; background: rgba(255,255,255,0.2);
      text-transform: uppercase;
    }

    /* Sezione nome strada */
    .info-road-name {
      padding: 14px 16px 10px;
      border-bottom: 2px solid #f1f5f9;
    }
    .info-road-name h3 {
      margin: 0 0 4px; font-size: 15px; color: var(--text-main); font-weight: 700;
    }
    .info-road-name p {
      margin: 0; font-size: 12px; color: var(--text-light);
    }

    .info-content { overflow-y: auto; flex-grow: 1; border-radius: 0 0 20px 20px; }

    /* Sezioni raggruppate */
    .info-section { padding: 10px 16px 4px; }
    .info-section-title {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .8px; color: var(--text-light); margin-bottom: 6px;
    }
    .info-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 0; border-bottom: 1px solid #f1f5f9; gap: 10px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-label {
      font-size: 12px; color: var(--text-light); font-weight: 500;
      display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    }
    .info-label svg { flex-shrink: 0; }
    .info-value {
      font-size: 12px; color: var(--text-main); font-weight: 600;
      text-align: right; word-break: break-word;
    }
    .info-badge-val {
      font-size: 11px; font-weight: 700; padding: 2px 8px;
      border-radius: 20px; white-space: nowrap;
    }
    .badge-green  { background: #dcfce7; color: #16a34a; }
    .badge-red    { background: #fee2e2; color: #dc2626; }
    .badge-blue   { background: #dbeafe; color: #2563eb; }
    .badge-orange { background: #ffedd5; color: #ea580c; }
    .badge-gray   { background: #f1f5f9; color: #475569; }

    /* Raw tags toggle */
    #rawToggle {
      display: flex; align-items: center; gap: 6px;
      padding: 10px 16px; cursor: pointer; font-size: 11px;
      color: var(--text-light); font-weight: 600;
      border-top: 1px solid #f1f5f9; user-select: none;
    }
    #rawToggle:hover { color: var(--text-main); }
    #rawTags { display: none; }
    #rawTags.open { display: block; }
    .tag-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .tag-table th {
      background: #f8fafc; padding: 7px 12px; text-align: left;
      color: var(--text-light); width: 38%; border-bottom: 1px solid #f1f5f9; font-weight: 600;
    }
    .tag-table td {
      padding: 7px 12px; color: var(--text-main);
      border-bottom: 1px solid #f1f5f9; word-break: break-all;
    }

    #status {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%) translateY(6px);
      background: var(--bg-dark); color: white; padding: 10px 20px;
      border-radius: 30px; font-size: 13px; font-weight: 500;
      z-index: 2000; display: flex; align-items: center; gap: 8px;
      opacity: 0; pointer-events: none;
      transition: opacity .3s, transform .3s; white-space: nowrap;
    }
    #status.show    { opacity: 1; transform: translateX(-50%) translateY(0); }
    #status.error   { background: #dc2626; }
    #status.success { background: #16a34a; }

    .spinner {
      width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.3);
      border-top-color: white; border-radius: 50%;
      animation: spin .7s linear infinite; flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div id="topbar">
    <span class="chip proposed" id="cntProposed">— Proposte</span>
    <span class="chip cycle"    id="cntCycle">— Ciclabili</span>
    <span class="chip sidewalk" id="cntSidewalk">— Marciapiedi</span>
    <button id="refreshBtn" class="ctrl-btn" title="Aggiorna"><i data-lucide="refresh-cw" width="18" height="18"></i></button>
  </div>

  <div id="map"></div>

  <div id="infoPanel">
    <div class="info-header" id="infoHeader">
      <div style="display:flex;align-items:center;gap:8px">
        <i data-lucide="map-pin" width="15" height="15"></i>
        <span id="infoTitle">Dettagli</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="info-type-badge" id="infoBadge"></span>
        <!-- FIX: listener sul div wrapper, non sull'icona lucide -->
        <div id="closeInfo"><i data-lucide="x" width="16" height="16"></i></div>
      </div>
    </div>

    <div id="infoRoadName" class="info-road-name" style="display:none">
      <h3 id="infoRoadNameText"></h3>
      <p id="infoRoadNameSub"></p>
    </div>

    <div class="info-content">
      <div id="infoSections"></div>

      <div id="rawToggle">
        <i data-lucide="code" width="13" height="13"></i>
        Dati tecnici grezzi
        <i data-lucide="chevron-down" width="13" height="13" id="rawChevron"></i>
      </div>
      <div id="rawTags">
        <table class="tag-table" id="infoTable"></table>
      </div>
    </div>
  </div>

  <div id="status"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/osmtogeojson@3.0.0-beta.4/osmtogeojson.js"></script>
  <script>
    lucide.createIcons();

    // ── MAP ──
    const map = L.map('map', { zoomControl: false }).setView([45.671, 11.928], 14);
    setTimeout(() => map.invalidateSize(), 100);
    L.control.zoom({ position: 'bottomleft' }).addTo(map);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors', maxZoom: 19
    }).addTo(map);

    const proposedLayer = L.layerGroup().addTo(map);
    const cycleLayer    = L.layerGroup().addTo(map);
    const sidewalkLayer = L.layerGroup().addTo(map);

    L.control.layers(null, {
      "<span style='color:#f97316;font-weight:700'>Proposte</span>":    proposedLayer,
      "<span style='color:#06b6d4;font-weight:700'>Ciclabili</span>":   cycleLayer,
      "<span style='color:#94a3b8;font-weight:700'>Marciapiedi</span>": sidewalkLayer
    }, { collapsed: false, position: 'bottomleft' }).addTo(map);

    // ── STATUS ──
    let statusTimer;
    function setStatus(msg, type = '', duration = 0) {
      clearTimeout(statusTimer);
      const s = document.getElementById('status');
      s.className = type ? `show ${type}` : 'show';
      s.innerHTML = type === 'loading'
        ? `<div class="spinner"></div>${msg}`
        : `<i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}" width="14" height="14" style="flex-shrink:0"></i>${msg}`;
      lucide.createIcons();
      if (duration) statusTimer = setTimeout(() => s.classList.remove('show'), duration);
    }

    // ── STILI MAPPA ──
    const STYLES = {
      proposed: { color: '#f97316', weight: 5, dashArray: '10 6', lineCap: 'round', opacity: .9 },
      cycleway:  { color: '#06b6d4', weight: 4, lineCap: 'round', opacity: .9 },
      sidewalk:  { color: '#94a3b8', weight: 2.5, lineCap: 'round', opacity: .85 },
      default:   { color: '#475569', weight: 2 }
    };

    function getType(tags) {
      if (tags.highway === 'proposed')                  return 'proposed';
      if (tags.highway === 'cycleway' || tags.cycleway) return 'cycleway';
      if (tags.footway === 'sidewalk')                  return 'sidewalk';
      return 'default';
    }

    const TYPE_META = {
      proposed: { label: 'Strada proposta', bg: '#f97316' },
      cycleway:  { label: 'Pista ciclabile', bg: '#06b6d4' },
      sidewalk:  { label: 'Marciapiede',     bg: '#64748b' },
      default:   { label: 'Via',              bg: '#1e293b' }
    };

    // ── DIZIONARIO ITALIANO TAG OSM ──
    const TAG_LABELS = {
      // Identità
      'name':        { it: 'Nome',           icon: 'tag' },
      'name:it':     { it: 'Nome (IT)',       icon: 'tag' },
      'ref':         { it: 'Codice/Ref.',    icon: 'hash' },
      'alt_name':    { it: 'Nome alternativo',icon: 'tag' },
      'official_name':{ it: 'Nome ufficiale', icon: 'tag' },
      // Tipo e infrastruttura
      'highway':     { it: 'Tipo di via',    icon: 'road' },
      'cycleway':    { it: 'Tipo ciclabile', icon: 'bike' },
      'footway':     { it: 'Tipo percorso',  icon: 'footprints' },
      'proposed':    { it: 'Proposta',       icon: 'clock' },
      'construction':{ it: 'In costruzione', icon: 'hard-hat' },
      // Caratteristiche fisiche
      'surface':     { it: 'Superficie',     icon: 'layers' },
      'width':       { it: 'Larghezza',      icon: 'ruler' },
      'lanes':       { it: 'Corsie',         icon: 'align-justify' },
      'maxspeed':    { it: 'Velocità max',   icon: 'gauge' },
      'lit':         { it: 'Illuminazione',  icon: 'lamp' },
      'incline':     { it: 'Pendenza',       icon: 'trending-up' },
      'smoothness':  { it: 'Qualità fondo',  icon: 'activity' },
      'segregated':  { it: 'Separato',       icon: 'separator-horizontal' },
      // Accesso
      'access':      { it: 'Accesso',        icon: 'lock' },
      'bicycle':     { it: 'Biciclette',     icon: 'bike' },
      'foot':        { it: 'Pedoni',         icon: 'footprints' },
      'motor_vehicle':{ it: 'Veicoli a motore', icon: 'car' },
      'oneway':      { it: 'Senso unico',    icon: 'arrow-right' },
      'oneway:bicycle':{ it: 'Senso unico bici', icon: 'arrow-right' },
      // Stato
      'condition':   { it: 'Condizioni',     icon: 'alert-circle' },
      'start_date':  { it: 'Data inizio',    icon: 'calendar' },
      'opening_date':{ it: 'Data apertura',  icon: 'calendar-check' },
      'operator':    { it: 'Gestore',        icon: 'building' },
      'source':      { it: 'Fonte dati',     icon: 'database' },
      'note':        { it: 'Note',           icon: 'message-square' },
      'description': { it: 'Descrizione',    icon: 'file-text' },
    };

    const VALUE_LABELS = {
      // highway
      'proposed':    'Proposta',
      'cycleway':    'Pista ciclabile',
      'footway':     'Percorso pedonale',
      'path':        'Sentiero',
      'residential': 'Strada residenziale',
      'primary':     'Strada principale',
      'secondary':   'Strada secondaria',
      'tertiary':    'Strada locale',
      'service':     'Accesso privato',
      'track':       'Pista sterrata',
      'steps':       'Scalinata',
      'pedestrian':  'Zona pedonale',
      'living_street':'Zona 30',
      // surface
      'asphalt':     'Asfalto',
      'concrete':    'Calcestruzzo',
      'paving_stones':'Pavé / Sampietrini',
      'gravel':      'Ghiaia',
      'unpaved':     'Non asfaltato',
      'dirt':        'Terra battuta',
      'grass':       'Erba',
      'cobblestone': 'Selciato',
      'wood':        'Legno',
      'compacted':   'Stabilizzato',
      // accesso
      'yes':         'Sì',
      'no':          'No',
      'private':     'Privato',
      'permissive':  'Consentito',
      'designated':  'Dedicato',
      'dismount':    'Solo a mano',
      'destination': 'Solo destinazione',
      'customers':   'Solo clienti',
      // oneway
      '-1':          'Senso inverso',
      // lit
      'automatic':   'Automatica',
      // smoothness
      'excellent':   'Eccellente',
      'good':        'Buono',
      'intermediate':'Discreto',
      'bad':         'Scarso',
      'very_bad':    'Pessimo',
      'horrible':    'Impraticabile',
      // segregated
      'sidewalk':    'Marciapiede',
      'lane':        'Corsia',
      'track':       'Pista separata',
      'share_busway':'Con autobus',
      'shared_lane': 'Corsia condivisa',
      'opposite':    'Contromano consentito',
    };

    // Gruppi tematici per l'info panel
    const GROUPS = [
      {
        title: 'Caratteristiche',
        icon: 'info',
        keys: ['highway','cycleway','footway','surface','width','lanes','lit','smoothness','incline','segregated']
      },
      {
        title: 'Accesso',
        icon: 'lock',
        keys: ['access','bicycle','foot','motor_vehicle','oneway','oneway:bicycle']
      },
      {
        title: 'Stato & Progetto',
        icon: 'calendar',
        keys: ['condition','start_date','opening_date','operator','note','description']
      }
    ];

    function translateValue(key, val) {
      if (!val || val === 'null') return null;
      return VALUE_LABELS[val] || val;
    }

    function valueBadge(key, val) {
      const v = translateValue(key, val);
      if (!v) return null;
      let cls = 'badge-gray';
      if (['yes','designated','permissive','excellent','good'].includes(val)) cls = 'badge-green';
      if (['no','private','bad','very_bad','horrible'].includes(val))         cls = 'badge-red';
      if (['proposed','construction'].includes(val))                           cls = 'badge-orange';
      if (['cycleway','footway','pedestrian'].includes(val))                   cls = 'badge-blue';
      return `<span class="info-badge-val ${cls}">${v}</span>`;
    }

    // ── APRI INFO PANEL ──
    function openInfoPanel(feature) {
      const tags = feature.properties;
      const type = getType(tags);
      const meta = TYPE_META[type];

      // Header
      document.getElementById('infoHeader').style.background = meta.bg;
      document.getElementById('infoBadge').textContent = meta.label;

      // Nome strada
      const name = tags.name || tags['name:it'] || tags['alt_name'] || '';
      const sub  = tags.ref ? `Riferimento: ${tags.ref}` : (tags['name:it'] && tags.name ? tags['name:it'] : '');
      const nameBlock = document.getElementById('infoRoadName');
      if (name) {
        document.getElementById('infoRoadNameText').textContent = name;
        document.getElementById('infoRoadNameSub').textContent  = sub;
        nameBlock.style.display = 'block';
        document.getElementById('infoTitle').textContent = name;
      } else {
        nameBlock.style.display = 'none';
        document.getElementById('infoTitle').textContent = meta.label;
      }

      // Sezioni tematiche
      const sectionsEl = document.getElementById('infoSections');
      let sectionsHTML = '';
      const usedKeys = new Set(['name','name:it','alt_name','official_name','ref']);

      GROUPS.forEach(group => {
        const rows = [];
        group.keys.forEach(key => {
          const val = tags[key];
          if (!val || val === 'null') return;
          usedKeys.add(key);
          const info  = TAG_LABELS[key] || { it: key, icon: 'tag' };
          const badge = valueBadge(key, val);
          rows.push(`
            <div class="info-row">
              <span class="info-label">
                <i data-lucide="${info.icon}" width="13" height="13"></i>
                ${info.it}
              </span>
              <span class="info-value">${badge || translateValue(key, val) || val}</span>
            </div>`);
        });
        if (rows.length) {
          sectionsHTML += `
            <div class="info-section">
              <div class="info-section-title">${group.title}</div>
              ${rows.join('')}
            </div>`;
        }
      });

      // Eventuali tag non categorizzati (esclusi tecnici OSM)
      const skipKeys = new Set(['id','type','@id','@timestamp','@version','@changeset','@uid','@user']);
      const extraRows = [];
      Object.keys(tags).sort().forEach(key => {
        if (usedKeys.has(key) || skipKeys.has(key)) return;
        const val = tags[key];
        if (!val || val === 'null') return;
        const info = TAG_LABELS[key] || { it: key, icon: 'tag' };
        const badge = valueBadge(key, val);
        extraRows.push(`
          <div class="info-row">
            <span class="info-label">
              <i data-lucide="${info.icon}" width="13" height="13"></i>
              ${info.it}
            </span>
            <span class="info-value">${badge || translateValue(key, val) || val}</span>
          </div>`);
      });
      if (extraRows.length) {
        sectionsHTML += `<div class="info-section"><div class="info-section-title">Altre info</div>${extraRows.join('')}</div>`;
      }

      sectionsEl.innerHTML = sectionsHTML || `<div style="padding:16px;font-size:13px;color:var(--text-light)">Nessun dettaglio disponibile.</div>`;

      // Raw tags
      const rawRows = Object.keys(tags).sort()
        .filter(k => tags[k] !== null && tags[k] !== '')
        .map(k => `<tr><th>${k}</th><td>${tags[k]}</td></tr>`).join('');
      document.getElementById('infoTable').innerHTML = rawRows;
      document.getElementById('rawTags').classList.remove('open');
      document.getElementById('rawChevron').setAttribute('data-lucide','chevron-down');

      document.getElementById('infoPanel').classList.add('active');
      lucide.createIcons(); // sicuro: la X è sul wrapper #closeInfo, non sull'icona
    }

    // ── RAW TOGGLE ──
    document.getElementById('rawToggle').addEventListener('click', () => {
      const raw = document.getElementById('rawTags');
      const chev = document.getElementById('rawChevron');
      raw.classList.toggle('open');
      chev.setAttribute('data-lucide', raw.classList.contains('open') ? 'chevron-up' : 'chevron-down');
      lucide.createIcons();
    });

    // ── LOAD DATA ──
    let counts = { proposed: 0, cycle: 0, sidewalk: 0 };

    function updateCounters() {
      document.getElementById('cntProposed').textContent = counts.proposed + ' Proposte';
      document.getElementById('cntCycle').textContent    = counts.cycle    + ' Ciclabili';
      document.getElementById('cntSidewalk').textContent = counts.sidewalk + ' Marciapiedi';
    }

    async function loadData() {
      document.getElementById('refreshBtn').classList.add('spinning');
      setStatus('Caricamento dati…', 'loading');
      proposedLayer.clearLayers(); cycleLayer.clearLayers(); sidewalkLayer.clearLayers();
      counts = { proposed: 0, cycle: 0, sidewalk: 0 };
      updateCounters();

      const query = `[out:json][timeout:30];
        area["name"="Castelfranco Veneto"]->.a;
        (
          way["highway"="proposed"](area.a);
          way["highway"="cycleway"](area.a);
          way["cycleway"](area.a);
          way["highway"="footway"]["footway"="sidewalk"](area.a);
        );
        out body; >; out skel qt;`;

      try {
        const res    = await fetch('https://overpass-api.de/api/interpreter', {
          method: 'POST', body: 'data=' + encodeURIComponent(query)
        });
        const data   = await res.json();
        const geojson = osmtogeojson(data);

        L.geoJSON(geojson, {
          style: f => ({ ...STYLES[getType(f.properties)] }),
          onEachFeature: (feature, layer) => {
            const tags = feature.properties;
            const type = getType(tags);
            const name = tags.name || tags['name:it'] || '';
            const base = { ...STYLES[type] };

            if (name) layer.bindTooltip(name, { sticky: true, className: 'osm-tooltip', direction: 'top' });
            layer.on('mouseover', () => layer.setStyle({ ...base, weight: base.weight + 2, opacity: 1 }));
            layer.on('mouseout',  () => layer.setStyle(base));
            layer.on('click', e  => { L.DomEvent.stopPropagation(e); openInfoPanel(feature); });

            if      (type === 'proposed') { layer.addTo(proposedLayer); counts.proposed++; }
            else if (type === 'cycleway') { layer.addTo(cycleLayer);    counts.cycle++; }
            else if (type === 'sidewalk') { layer.addTo(sidewalkLayer); counts.sidewalk++; }
          }
        });

        updateCounters();
        setStatus(`${geojson.features.length} elementi caricati`, 'success', 3000);
      } catch {
        setStatus('Errore caricamento dati', 'error', 4000);
      } finally {
        document.getElementById('refreshBtn').classList.remove('spinning');
      }
    }

    // ── EVENTI ──
    // FIX X: listener sul wrapper div, sopravvive a lucide.createIcons()
    document.getElementById('closeInfo').addEventListener('click', () =>
      document.getElementById('infoPanel').classList.remove('active'));
    document.getElementById('refreshBtn').addEventListener('click', loadData);
    map.on('click', () => document.getElementById('infoPanel').classList.remove('active'));

    // Tooltip style
    const s = document.createElement('style');
    s.textContent = `.osm-tooltip {
      background: #0f172a; color: white; border: none;
      border-radius: 8px; padding: 4px 10px; font-size: 12px;
      font-family: Inter, sans-serif; font-weight: 600;
      box-shadow: 0 4px 12px rgba(0,0,0,.3);
    }
    .osm-tooltip::before { display: none; }`;
    document.head.appendChild(s);

    loadData();
  </script>
</body>
</html>
